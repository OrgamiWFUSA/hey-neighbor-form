<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Neighbor — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage:       #6B8F5E;
    --sage-light: #E4EDE0;
    --sage-mid:   #C8D4C0;
    --sage-dark:  #3D5C34;
    --forest:     #2D3B2A;
    --cream:      #F8F6F1;
    --warm-white: #FDFCF9;
    --text:       #2D3B2A;
    --text-muted: #6A7A65;
    --border:     #C8D4C0;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans:  'Jost', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 600;
    color: var(--forest);
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }

  .logo-leaf {
    width: 18px;
    height: 18px;
    background: var(--sage);
    border-radius: 50% 0 50% 0;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  .nav-link {
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
  }

  .nav-link:hover { color: var(--forest); }

  .page-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .login-card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 44px;
    width: 100%;
    max-width: 440px;
  }

  .login-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 10px;
  }

  .login-title {
    font-family: var(--font-serif);
    font-size: 36px;
    font-weight: 600;
    color: var(--forest);
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .login-sub {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 32px;
    line-height: 1.6;
  }

  .field-group {
    margin-bottom: 24px;
  }

  .field-group label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .field-group input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--sage-mid);
    font-family: var(--font-sans);
    font-size: 17px;
    color: var(--forest);
    padding: 8px 0;
    outline: none;
    transition: border-color 0.2s;
  }

  .field-group input:focus { border-bottom-color: var(--sage); }
  .field-group input::placeholder { color: #BCC8B8; }

  .forgot-link {
    display: block;
    text-align: right;
    font-size: 12px;
    color: var(--sage);
    text-decoration: none;
    margin-top: 6px;
    cursor: pointer;
  }

  .forgot-link:hover { text-decoration: underline; }

  .btn-login {
    width: 100%;
    background: var(--sage);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 16px;
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 28px;
    transition: background 0.15s;
    letter-spacing: 0.03em;
  }

  .btn-login:hover { background: var(--sage-dark); }
  .btn-login:disabled { background: var(--sage-mid); cursor: default; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .divider-text {
    font-size: 12px;
    color: var(--text-muted);
  }

  .btn-google {
    width: 100%;
    background: var(--warm-white);
    color: var(--forest);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 14px;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .btn-google:hover { background: var(--sage-light); border-color: var(--sage-mid); }

  .google-icon {
    width: 18px;
    height: 18px;
  }

  .error-msg {
    display: none;
    background: #FEE2E2;
    border: 1px solid #FCA5A5;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #B91C1C;
    margin-top: 16px;
    text-align: center;
  }

  .error-msg.show { display: block; }

  .reset-msg {
    display: none;
    background: var(--sage-light);
    border: 1px solid var(--sage-mid);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--sage-dark);
    margin-top: 16px;
    text-align: center;
  }

  .reset-msg.show { display: block; }

  .signup-note {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 28px;
  }

  .signup-note a {
    color: var(--sage);
    text-decoration: none;
    font-weight: 500;
  }

  .signup-note a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .login-card { padding: 36px 24px; }
    nav { padding: 14px 20px; }
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <div class="logo-leaf"></div>
    Hey Neighbor
  </a>
  <a class="nav-link" href="heyneighbor-join.html">Not a member? Join free →</a>
</nav>

<div class="page-wrap">
  <div class="login-card">

    <div class="login-eyebrow">Welcome back</div>
    <h1 class="login-title">Log in to your village.</h1>
    <p class="login-sub">Good to see you again. Log in to access member pricing and your community board.</p>

    <div class="field-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="jane@example.com" />
    </div>

    <div class="field-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" />
      <span class="forgot-link" onclick="handleForgotPassword()">Forgot password?</span>
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">
      Log in →
    </button>

    <div class="error-msg" id="errorMsg"></div>
    <div class="reset-msg" id="resetMsg">✅ Password reset email sent! Check your inbox.</div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <button class="btn-google" id="googleBtn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <p class="signup-note">
      Don't have an account? <a href="heyneighbor-join.html">Join Hey Neighbor free →</a>
    </p>

  </div>
</div>

<script>
  function handleLogin() {
    console.log("Login button clicked!");
    document.dispatchEvent(new CustomEvent('hn-login', {
      detail: {
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      }
    }));
  }

  function handleForgotPassword() {
    console.log("Forgot password clicked!");
    document.dispatchEvent(new CustomEvent('hn-reset', {
      detail: { email: document.getElementById('loginEmail').value }
    }));
  }

  document.getElementById('googleBtn').addEventListener('click', () => {
    document.dispatchEvent(new CustomEvent('hn-google-login'));
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>

<script type="module">
  import { auth } from './firebase-init.js';
  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  console.log("Firebase login ready!");

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
  }

  // Email/Password Login
  document.addEventListener('hn-login', async (e) => {
    const { email, password } = e.detail;
    console.log("hn-login fired!");

    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }

    hideError();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Log in →';
      if (err.code === 'auth/user-not-found') showError('No account found with that email.');
      else if (err.code === 'auth/wrong-password') showError('Incorrect password. Try again.');
      else if (err.code === 'auth/invalid-email') showError('Please enter a valid email address.');
      else showError('Something went wrong. Please try again.');
    }
  });

  // Forgot Password
  document.addEventListener('hn-reset', async (e) => {
    const { email } = e.detail;
    if (!email) { showError('Enter your email above first.'); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      document.getElementById('resetMsg').classList.add('show');
      hideError();
    } catch (err) {
      showError('Could not send reset email. Check the address and try again.');
    }
  });

  // Google Login
  document.addEventListener('hn-google-login', async () => {
    const provider = new GoogleAuthProvider();
    try {
      await signInWithPopup(auth, provider);
      window.location.href = 'dashboard.html';
    } catch (err) {
      console.error(err);
      showError('Google sign in failed. Please try again.');
    }
  });
</script>

</body>
</html>
