<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Neighbor — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #6B8F5E;
    --sage-light: #E4EDE0;
    --sage-mid: #C8D4C0;
    --sage-dark: #3D5C34;
    --forest: #2D3B2A;
    --cream: #F8F6F1;
    --warm-white: #FDFCF9;
    --text: #2D3B2A;
    --text-muted: #6A7A65;
    --border: #C8D4C0;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans: 'Jost', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--cream); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  nav { background: var(--warm-white); border-bottom: 1px solid var(--border); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: var(--font-serif); font-size: 22px; font-weight: 600; color: var(--forest); display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo-leaf { width: 18px; height: 18px; background: var(--sage); border-radius: 50% 0 50% 0; transform: rotate(45deg); flex-shrink: 0; }
  .page-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
  .card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 16px; padding: 48px 44px; width: 100%; max-width: 440px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: var(--sage); margin-bottom: 10px; }
  .title { font-family: var(--font-serif); font-size: 36px; font-weight: 600; color: var(--forest); line-height: 1.2; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; line-height: 1.6; }
  .field-group { margin-bottom: 24px; }
  .field-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .field-group input { width: 100%; background: transparent; border: none; border-bottom: 1.5px solid var(--sage-mid); font-family: var(--font-sans); font-size: 17px; color: var(--forest); padding: 8px 0; outline: none; transition: border-color 0.2s; }
  .field-group input:focus { border-bottom-color: var(--sage); }
  .field-group input::placeholder { color: #BCC8B8; }
  .btn { width: 100%; background: var(--sage); color: #fff; border: none; border-radius: 50px; padding: 16px; font-family: var(--font-sans); font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
  .btn:hover { background: var(--sage-dark); }
  .btn:disabled { background: var(--sage-mid); cursor: default; }
  .password-strength { height: 3px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .password-strength-bar { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0%; }
  .strength-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  .error-msg { display: none; background: #FEE2E2; border: 1px solid #FCA5A5; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #B91C1C; margin-top: 16px; text-align: center; }
  .error-msg.show { display: block; }
  .success-msg { display: none; background: var(--sage-light); border: 1px solid var(--sage-mid); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--sage-dark); margin-top: 16px; text-align: center; }
  .success-msg.show { display: block; }
</style>
</head>
<body>
<nav>
  <a class="logo" href="index.html">
    <div class="logo-leaf"></div>
    Hey Neighbor
  </a>
</nav>

<div class="page-wrap">
  <div class="card">
    <div class="eyebrow">Account Security</div>
    <h1 class="title">Set a new password.</h1>
    <p class="subtitle">Choose a strong password for your Hey Neighbor account.</p>

    <div id="formSection">
      <div class="field-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" oninput="checkStrength(this.value)" />
        <div class="password-strength">
          <div class="password-strength-bar" id="strengthBar"></div>
        </div>
        <div class="strength-hint" id="strengthHint">At least 6 characters</div>
      </div>
      <div class="field-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" />
      </div>
      <button class="btn" id="resetBtn" onclick="handleReset()">Set new password →</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>
    </div>
  </div>
</div>

<script>
  function checkStrength(password) {
    const bar = document.getElementById('strengthBar');
    const hint = document.getElementById('strengthHint');
    let strength = 0;
    if (password.length >= 6) strength++;
    if (password.length >= 10) strength++;
    if (/[A-Z]/.test(password)) strength++;
    if (/[0-9]/.test(password)) strength++;
    if (/[^A-Za-z0-9]/.test(password)) strength++;
    const colors = ['#EF4444', '#F97316', '#EAB308', '#22C55E', '#16A34A'];
    const hints = ['Too short', 'Weak', 'Fair', 'Good', 'Strong'];
    const widths = ['20%', '40%', '60%', '80%', '100%'];
    bar.style.width = widths[strength - 1] || '0%';
    bar.style.background = colors[strength - 1] || '#E5E7EB';
    hint.textContent = hints[strength - 1] || 'At least 6 characters';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('successMsg').classList.remove('show');
  }

  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.classList.add('show');
    document.getElementById('errorMsg').classList.remove('show');
  }

  function handleReset() {
    document.dispatchEvent(new CustomEvent('hn-reset-password'));
  }
</script>

<script type="module">
  import { auth } from './firebase-init.js';
  import {
    verifyPasswordResetCode,
    confirmPasswordReset
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  // Get the action code from the URL
  const urlParams = new URLSearchParams(window.location.search);
  const oobCode = urlParams.get('oobCode');

  if (!oobCode) {
    document.getElementById('formSection').innerHTML = `
      <div style="text-align:center; color:#B91C1C; font-size:14px;">
        Invalid or expired reset link. Please request a new one.
        <br><br>
        <a href="login.html" style="color:var(--sage);">Back to login →</a>
      </div>
    `;
  } else {
    // Verify the code is valid
    verifyPasswordResetCode(auth, oobCode).catch(() => {
      document.getElementById('formSection').innerHTML = `
        <div style="text-align:center; color:#B91C1C; font-size:14px;">
          This reset link has expired. Please request a new one.
          <br><br>
          <a href="login.html" style="color:var(--sage);">Back to login →</a>
        </div>
      `;
    });
  }

  document.addEventListener('hn-reset-password', async () => {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('resetBtn');

    if (!newPassword || newPassword.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }

    if (newPassword !== confirmPassword) {
      showError('Passwords do not match.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      await confirmPasswordReset(auth, oobCode, newPassword);
      showSuccess('✅ Password updated! Redirecting to login...');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2500);
    } catch (err) {
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Set new password →';
      if (err.code === 'auth/expired-action-code') {
        showError('This reset link has expired. Please request a new one.');
      } else if (err.code === 'auth/weak-password') {
        showError('Password is too weak. Please choose a stronger password.');
      } else {
        showError('Could not reset password. Please try again.');
      }
    }
  });
</script>

</body>
</html>
